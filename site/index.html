<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>read.lagierr.me</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Lora:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>if (window.tailwind) tailwind.config = { darkMode: "class", theme: { extend: { fontFamily: { sans: ["Plus Jakarta Sans", "system-ui"], serif: ["Lora", "Georgia", "serif"], mono: ["JetBrains Mono", "monospace"] }, colors: { void: "#000" } } } };</script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.2"></script>
    <style>
      body { margin: 0; background: #000; color: #f5f5f7; -webkit-font-smoothing: antialiased; }
      .glass { background: rgba(18,18,20,.78); backdrop-filter: blur(28px) saturate(180%); border: 1px solid rgba(255,255,255,.09); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 12px 32px -12px #000c; }
      .pill { background: #fff; color: #000; font-weight: 600; font-size: 12px; padding: .7rem 1.25rem; border-radius: 1rem; }
      .pill:disabled { opacity: .35; cursor: default; }
      .chip { border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04); color: #d4d4d8; border-radius: .75rem; padding: .4rem .75rem; font: 500 12px "JetBrains Mono", monospace; }
      .input { width: 100%; background: #0009; border: 1px solid #ffffff1a; border-radius: 1rem; padding: .7rem 1rem; color: #fff; outline: 0; }
      .input:focus { border-color: #ffffff66; }
      .input::placeholder { color: #52525b; }
      .prose-reader p { margin: 0 0 1.35em; text-wrap: pretty; overflow-wrap: anywhere; }
      .orb { background: radial-gradient(circle at 50% 0, #ffffff10, transparent 70%); pointer-events: none; }
      .toast { animation: toast-in .2s ease; } @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } }
      button:focus-visible, input:focus-visible { outline: 2px solid #ffffff99; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState, useEffect, useMemo, useCallback, useRef } = React;
      const CONFIG = {
        api: localStorage.getItem("lr_api_url") || "https://lreadfunc.fra.appwrite.run",
        endpoint: localStorage.getItem("lr_aw_endpoint") || "https://fra.cloud.appwrite.io/v1",
        project: localStorage.getItem("lr_aw_project") || "YOUR_APPWRITE_PROJECT_ID",
      };
      const THEMES = {
        void: { bg: "#000", surface: "rgba(16,16,18,.88)", text: "#e5e5ea", border: "#ffffff1a", accent: "#fff" },
        graphite: { bg: "#101012", surface: "rgba(26,26,29,.9)", text: "#d1d1d6", border: "#ffffff20", accent: "#fff" },
        sepia: { bg: "#f2ead8", surface: "rgba(232,221,198,.94)", text: "#2c2218", border: "#2c221826", accent: "#1c150e" },
        paper: { bg: "#fafafa", surface: "rgba(255,255,255,.94)", text: "#1c1c1e", border: "#0000001a", accent: "#000" },
      };
      const FONTS = { sans: "font-sans", serif: "font-serif", mono: "font-mono" };
      const cache = new Map();
      const readJSON = (key, fallback) => { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } };
      const hostname = (url) => { try { return new URL(url).hostname.replace(/^www\./, ""); } catch { return "webnovel"; } };
      const readMinutes = (text) => Math.max(1, Math.round((text || "").trim().split(/\s+/).length / 230));

      function Modal({ title, close, children }) {
        return <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4" onClick={close}>
          <div className="glass rounded-[28px] max-w-md w-full p-6 space-y-5 max-h-[90vh] overflow-y-auto" onClick={(event) => event.stopPropagation()}>
            <div className="flex items-center justify-between"><h2 className="font-semibold">{title}</h2><button onClick={close} className="text-zinc-400">✕</button></div>{children}
          </div>
        </div>;
      }

      function App() {
        const [config, setConfig] = useState(CONFIG);
        const [user, setUser] = useState(null);
        const [authLoading, setAuthLoading] = useState(true);
        const [authMode, setAuthMode] = useState("login");
        const [authForm, setAuthForm] = useState({ name: "", email: "", password: "" });
        const [authError, setAuthError] = useState("");
        const [novels, setNovels] = useState([]);
        const [view, setView] = useState("library");
        const [active, setActive] = useState(null);
        const [chapterIndex, setChapterIndex] = useState(0);
        const [chapter, setChapter] = useState(null);
        const [chapterError, setChapterError] = useState("");
        const [loading, setLoading] = useState(false);
        const [adding, setAdding] = useState(false);
        const [url, setUrl] = useState("");
        const [filter, setFilter] = useState("");
        const [search, setSearch] = useState("");
        const [statsOpen, setStatsOpen] = useState(false);
        const [admin, setAdmin] = useState(false);
        const [bookmarks, setBookmarks] = useState(() => readJSON("lr_bookmarks", {}));
        const [stats, setStats] = useState(() => readJSON("lr_stats", { chapters: 0, minutes: 0 }));
        const [prefs, setPrefs] = useState(() => ({ fontSize: 18, lineHeight: 1.78, font: "serif", theme: "void", width: 680, ...readJSON("lr_prefs", {}) }));
        const account = useMemo(() => {
          if (!config.project || config.project === "YOUR_APPWRITE_PROJECT_ID" || !window.Appwrite) return null;
          try { return new Appwrite.Account(new Appwrite.Client().setEndpoint(config.endpoint).setProject(config.project)); } catch { return null; }
        }, [config.endpoint, config.project]);
        const userId = user?.$id || "guest_local";
        const base = (config.api || "").replace(/\/+$/, "");
        const headers = useCallback(() => ({ "Content-Type": "application/json", "X-User-Id": userId }), [userId]);
        const request = useCallback(async (path, options = {}) => {
          const response = await fetch(`${base}/${path.replace(/^\/+/, "")}`, { ...options, headers: { ...headers(), ...(options.headers || {}) } });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error || data.message || `Request failed (${response.status})`);
          return data;
        }, [base, headers]);

        useEffect(() => { localStorage.setItem("lr_prefs", JSON.stringify(prefs)); }, [prefs]);
        useEffect(() => { localStorage.setItem("lr_bookmarks", JSON.stringify(bookmarks)); }, [bookmarks]);
        useEffect(() => { localStorage.setItem("lr_stats", JSON.stringify(stats)); }, [stats]);
        useEffect(() => {
          let mounted = true;
          (async () => {
            if (!account) { setUser({ $id: "guest_local", name: "Guest", isGuest: true }); setAuthLoading(false); return; }
            try { if (mounted) setUser(await account.get()); } catch { if (mounted) setUser(null); } finally { if (mounted) setAuthLoading(false); }
          })();
          return () => { mounted = false; };
        }, [account]);
        const loadLibrary = useCallback(async () => {
          if (!user) return;
          try {
            const data = await request(`/library?userId=${encodeURIComponent(userId)}`);
            const list = Array.isArray(data) ? data : data.novels || [];
            setNovels(list); localStorage.setItem(`lr_cache_${userId}`, JSON.stringify(list));
          } catch (error) {
            const cached = readJSON(`lr_cache_${userId}`, null);
            if (cached) setNovels(cached); else setAuthError(error.message);
          }
        }, [request, user, userId]);
        useEffect(() => { if (user) loadLibrary(); }, [user, loadLibrary]);
        const login = async (event) => {
          event.preventDefault(); setAuthError("");
          if (!account) { setAuthError("Authentication is not configured. Unlock Admin settings and add an Appwrite project ID, or continue as Guest."); return; }
          try {
            if (authMode === "signup") await account.create(Appwrite.ID.unique(), authForm.email, authForm.password, authForm.name || authForm.email.split("@")[0]);
            await account.createEmailPasswordSession(authForm.email, authForm.password); setUser(await account.get());
          } catch (error) { setAuthError(error.message || "Authentication failed"); }
        };
        const logout = async () => { if (account && !user?.isGuest) try { await account.deleteSession("current"); } catch {} setUser(null); setNovels([]); setView("library"); };
        const saveSettings = (event) => {
          event.preventDefault(); localStorage.setItem("lr_api_url", config.api.trim()); localStorage.setItem("lr_aw_endpoint", config.endpoint.trim()); localStorage.setItem("lr_aw_project", config.project.trim()); setAdmin(false);
        };
        const addNovel = async (event) => {
          event.preventDefault(); if (!url.trim()) return; setAdding(true);
          try { const data = await request("/novel", { method: "POST", body: JSON.stringify({ url: url.trim(), userId }) }); setUrl(""); await loadLibrary(); setActive(data.novel || data); setView("novel"); }
          catch (error) { setAuthError(error.message); } finally { setAdding(false); }
        };
        const removeNovel = async (novel) => {
          if (!window.confirm(`Remove "${novel.title || "this novel"}" from your shelf?`)) return;
          try { await request("/novel", { method: "DELETE", body: JSON.stringify({ url: novel.url, userId }) }); } catch (error) { setAuthError(error.message); return; }
          setNovels((items) => items.filter((item) => item.url !== novel.url)); if (active?.url === novel.url) setView("library");
        };
        const openChapter = useCallback(async (novel, index, resume = false) => {
          const target = novel?.chapters?.[index]; if (!target) return;
          setActive(novel); setChapterIndex(index); setView("reader"); setChapterError(""); setLoading(true); window.scrollTo({ top: 0, behavior: "instant" });
          try {
            let data = cache.get(target.url);
            if (!data) { data = await request(`/chapter?url=${encodeURIComponent(target.url)}&userId=${encodeURIComponent(userId)}&novelUrl=${encodeURIComponent(novel.url)}`); cache.set(target.url, data); }
            setChapter(data); setStats((old) => ({ chapters: old.chapters + 1, minutes: old.minutes + readMinutes(data.text || data.content) }));
            setNovels((items) => items.map((item) => item.url === novel.url ? { ...item, lastReadIndex: index, lastReadChapterUrl: target.url, lastReadChapterTitle: target.title } : item));
            request("/progress", { method: "POST", body: JSON.stringify({ userId, novelUrl: novel.url, lastReadChapterUrl: target.url, lastReadChapterTitle: target.title, lastReadIndex: index }) }).catch(() => {});
            const next = novel.chapters[index + 1]; if (next && !cache.has(next.url)) request(`/chapter?url=${encodeURIComponent(next.url)}&userId=${encodeURIComponent(userId)}&novelUrl=${encodeURIComponent(novel.url)}`).then((nextData) => cache.set(next.url, nextData)).catch(() => {});
            if (resume) setTimeout(() => window.scrollTo({ top: Number(readJSON("lr_scroll", {})[target.url] || 0), behavior: "instant" }), 50);
          } catch (error) { setChapter(null); setChapterError(error.message); } finally { setLoading(false); }
        }, [request, userId]);
        const filtered = useMemo(() => novels.filter((novel) => !filter || `${novel.title} ${novel.author}`.toLowerCase().includes(filter.toLowerCase())), [novels, filter]);
        const chapters = useMemo(() => (active?.chapters || []).map((item, index) => ({ ...item, index })).filter((item) => !search || item.title.toLowerCase().includes(search.toLowerCase())), [active, search]);
        const toast = authError && <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 glass rounded-full px-4 py-3 text-xs max-w-[90vw]">{authError}<button className="ml-3 text-zinc-400" onClick={() => setAuthError("")}>✕</button></div>;

        if (authLoading) return <div className="min-h-screen bg-void flex items-center justify-center font-mono text-xs text-zinc-500">read.lagierr.me</div>;
        if (!user) return <div className="min-h-screen bg-void flex items-center justify-center p-5"><div className="glass rounded-[28px] p-7 w-full max-w-sm"><h1 className="font-serif text-3xl mb-2">{authMode === "login" ? "Welcome back" : "Create your shelf"}</h1><p className="text-sm text-zinc-400 mb-6">Sign in to sync your library across devices.</p>{authError && <p className="text-xs text-red-300 mb-4">{authError}</p>}<form onSubmit={login} className="space-y-3">{authMode === "signup" && <input className="input" placeholder="Name" required value={authForm.name} onChange={(e) => setAuthForm({ ...authForm, name: e.target.value })} />}<input className="input" type="email" placeholder="Email" required value={authForm.email} onChange={(e) => setAuthForm({ ...authForm, email: e.target.value })} /><input className="input" type="password" minLength="8" placeholder="Password" required value={authForm.password} onChange={(e) => setAuthForm({ ...authForm, password: e.target.value })} /><button className="pill w-full">{authMode === "login" ? "Sign in" : "Create account"}</button></form><button className="text-xs text-zinc-400 mt-5" onClick={() => { setAuthMode(authMode === "login" ? "signup" : "login"); setAuthError(""); }}>{authMode === "login" ? "Create an account" : "Sign in instead"}</button></div></div>;

        const theme = THEMES[prefs.theme];
        const nav = <header className="sticky top-0 z-30 bg-black/80 backdrop-blur-xl border-b border-white/10 px-4 py-3"><div className="max-w-5xl mx-auto flex justify-between items-center"><button className="font-semibold" onClick={() => setView("library")}>● read.lagierr.me</button><div className="flex gap-2"><button className="chip" onClick={() => setStatsOpen(true)}>Stats</button><button className="chip" onClick={() => setAdmin(true)}>Settings</button><button className="chip" onClick={logout}>{user.isGuest ? "Sign in" : "Sign out"}</button></div></div></header>;
        const settingsModal = admin && <Modal title="Settings" close={() => setAdmin(false)}><form onSubmit={saveSettings} className="space-y-3"><label className="text-xs text-zinc-400">Scraper API URL<input className="input mt-1 text-xs" value={config.api} onChange={(e) => setConfig({ ...config, api: e.target.value })} /></label><label className="text-xs text-zinc-400">Appwrite endpoint<input className="input mt-1 text-xs" value={config.endpoint} onChange={(e) => setConfig({ ...config, endpoint: e.target.value })} /></label><label className="text-xs text-zinc-400">Appwrite project ID<input className="input mt-1 text-xs" value={config.project} onChange={(e) => setConfig({ ...config, project: e.target.value })} /></label><button className="pill w-full">Save settings</button></form></Modal>;
        const statsModal = statsOpen && <Modal title="Reading statistics" close={() => setStatsOpen(false)}><div className="grid grid-cols-2 gap-3 text-center"><div className="glass p-4 rounded-2xl"><b className="text-2xl">{stats.chapters}</b><p className="text-xs text-zinc-400">Chapters</p></div><div className="glass p-4 rounded-2xl"><b className="text-2xl">{stats.minutes}m</b><p className="text-xs text-zinc-400">Reading time</p></div></div></Modal>;

        if (view === "reader" && active) return <div style={{ background: theme.bg, color: theme.text }} className="min-h-screen"><header style={{ background: theme.surface, borderColor: theme.border }} className="sticky top-0 z-30 border-b p-3"><div className="max-w-3xl mx-auto flex justify-between gap-3"><button onClick={() => setView("novel")} className="text-xs">← Chapters</button><span className="truncate text-xs">{active.title}</span><button onClick={() => setPrefs({ ...prefs, theme: prefs.theme === "void" ? "sepia" : "void" })}>Aa</button></div></header><main style={{ maxWidth: prefs.width }} className={`mx-auto px-5 py-10 prose-reader ${FONTS[prefs.font] || FONTS.serif}`}><p className="font-mono text-xs opacity-60">Chapter {chapterIndex + 1} of {active.chapters.length}</p><h1 className="font-serif text-3xl mb-10">{chapter?.title || active.chapters[chapterIndex]?.title}</h1>{loading ? <p>Loading chapter…</p> : chapterError ? <p className="text-red-300">{chapterError}</p> : (chapter?.text || chapter?.content || "").split(/\n+/).filter(Boolean).map((paragraph, index) => <p key={index}>{paragraph}</p>)}<div className="flex justify-between border-t pt-8 mt-12" style={{ borderColor: theme.border }}><button disabled={!chapterIndex} onClick={() => openChapter(active, chapterIndex - 1)} className="chip">← Previous</button><button disabled={chapterIndex >= active.chapters.length - 1} onClick={() => openChapter(active, chapterIndex + 1)} className="pill">Next chapter →</button></div></main></div>;
        if (view === "novel" && active) return <div className="min-h-screen bg-void">{nav}<main className="max-w-4xl mx-auto p-5 sm:p-8"><button className="chip mb-5" onClick={() => setView("library")}>← Shelf</button><section className="glass rounded-[28px] p-6 flex gap-5"><div className="w-28 h-40 rounded-2xl overflow-hidden bg-zinc-950 shrink-0">{(active.cover || active.coverImageUrl) && <img src={active.cover || active.coverImageUrl} className="w-full h-full object-cover" />}</div><div><h1 className="font-serif text-3xl">{active.title}</h1><p className="text-sm text-zinc-400 mt-2">{active.author || "Unknown author"} · {active.chapters?.length || 0} chapters</p><p className="text-sm text-zinc-400 mt-4 max-w-xl">{active.synopsis}</p><button className="pill mt-6" disabled={!active.chapters?.length} onClick={() => openChapter(active, active.lastReadIndex || 0, true)}>{active.lastReadIndex > 0 ? `Resume chapter ${active.lastReadIndex + 1}` : "Start reading"}</button></div></section><div className="glass rounded-[28px] p-5 mt-5"><div className="flex gap-2 mb-4"><input className="input" placeholder="Search chapters" value={search} onChange={(e) => setSearch(e.target.value)} /><button className="chip" onClick={() => request("/novel", { method: "POST", body: JSON.stringify({ url: active.url, userId }) }).then(loadLibrary)}>Refresh</button><button className="chip" onClick={() => removeNovel(active)}>Delete</button></div><div className="max-h-[60vh] overflow-y-auto">{chapters.map((item) => <button key={item.index} className="w-full text-left p-3 rounded-xl text-sm text-zinc-300 hover:bg-white/10" onClick={() => openChapter(active, item.index)}>{item.title || `Chapter ${item.index + 1}`}</button>)}</div></div></main>{settingsModal}{statsModal}</div>;
        return <div className="min-h-screen bg-void">{nav}<div className="orb absolute inset-0 h-96" /><main className="relative max-w-5xl mx-auto p-5 sm:p-10"><section className="glass rounded-[28px] p-6 mb-7"><h1 className="font-serif text-4xl mb-5">Read without the noise.</h1><form onSubmit={addNovel} className="flex flex-col sm:flex-row gap-2"><input className="input" type="url" required placeholder="Paste a novel URL" value={url} onChange={(e) => setUrl(e.target.value)} /><button className="pill shrink-0" disabled={adding}>{adding ? "Adding…" : "Add story"}</button></form></section><div className="flex justify-between items-center mb-4"><h2 className="font-mono text-xs uppercase text-zinc-400">Library ({filtered.length})</h2><input className="input !w-52 !py-2 text-xs" placeholder="Search shelf" value={filter} onChange={(e) => setFilter(e.target.value)} /></div><div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">{filtered.map((novel) => <article key={novel._id || novel.url} className="glass rounded-[24px] p-4"><button className="w-full text-left" onClick={() => { setActive(novel); setView("novel"); }}><div className="flex gap-4"><div className="w-20 h-28 rounded-2xl bg-zinc-950 overflow-hidden shrink-0">{(novel.cover || novel.coverImageUrl) && <img src={novel.cover || novel.coverImageUrl} className="w-full h-full object-cover" />}</div><div className="min-w-0"><h3 className="font-serif text-lg line-clamp-2">{novel.title || hostname(novel.url)}</h3><p className="text-xs text-zinc-400 mt-1">{novel.author || "Unknown author"}</p><p className="text-xs text-zinc-500 mt-3">{novel.chapters?.length || 0} chapters</p></div></div></button><button className="pill mt-4 w-full" disabled={!novel.chapters?.length} onClick={() => openChapter(novel, novel.lastReadIndex || 0, true)}>{novel.lastReadIndex > 0 ? "Resume reading" : "Start reading"}</button></article>)}</div></main>{settingsModal}{statsModal}</div>;
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
